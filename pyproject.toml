[project]
name = "open_in_cloud_workflow"
version = "0.0.dev1"
authors = [
    {name = "Francesco Ballarin", email = "francesco.ballarin@unicatt.it"},
]
maintainers = [
    {name = "Francesco Ballarin", email = "francesco.ballarin@unicatt.it"},
]
description = "Open in Cloud workflow"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "nbformat>=5.10.0"
]

[project.urls]
homepage = "https://fem-on-colab.github.io"
repository = "https://github.com/fem-on-colab/open-in-colab-workflow"
issues = "https://github.com/fem-on-colab/open-in-colab-workflow/issues"
funding = "https://github.com/sponsors/francesco-ballarin"

[dependency-groups]
dev = [
    "coverage[toml]>=7.4.3",
    "nbval>=0.10.0",
    "prek>=0.2.24",
    "pytest>=7.4.3",
    "requests>=2.30.0",
    "ruff>=0.2.2",
    "ty>=0.0.24",
    "yamllint>=1.38.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_in_cloud_workflow"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "FLY", "ICN", "N", "NPY", "Q", "RUF", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/open_in_cloud_workflow/__init__.py" = ["F401"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"
