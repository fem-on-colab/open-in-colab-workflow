name: CI

on:
  push:
    branches:
      - "**"
      - "!open-in-colab"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * THU"
  workflow_dispatch:

jobs:
  test_library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install apt dependencies of the workflow call library
        run: |
          sudo apt install -y -qq imagemagick inkscape
          wget https://github.com/rclone/rclone/releases/download/v1.73.3/rclone-v1.73.3-linux-amd64.deb -O /tmp/rclone-v1.73.3-linux-amd64.deb
          sudo dpkg -i /tmp/rclone-v1.73.3-linux-amd64.deb
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Install the workflow call library
        run: |
          uv sync --frozen
      - name: Run prek
        run: |
          uv run prek --all-files --show-diff-on-failure
      - name: Run tests
        run: |
          uv run coverage run --source=open_in_cloud_workflow -m pytest tests
        env:
          RCLONE_CONFIG_DRIVE_CLIENT_ID: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}"
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}"
          RCLONE_CONFIG_DRIVE_TOKEN: "${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}"
      - name: Check test coverage
        run: |
          uv run coverage report --fail-under=100 --show-missing --skip-covered

  upload_notebooks_as_artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Store notebook files in an artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: all-notebooks
          path: |
            **/*.ipynb
          retention-days: 1
          if-no-files-found: error

  test_workflow_publish_on_artifact_notebooks_from_git:
    needs: [test_library]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      extra_files_pattern: "**/*.dat"
      notebook_preparation: |
        rsync -avz --include "*/" --include="*.ipynb" --exclude="*" source/tests open_in_colab/
      extra_files_preparation: |
        rsync -avz --include "*/" --include="*.png" --include="*.jpg" --include="*.svg" --exclude="*" source/tests open_in_colab/
        mkdir -p open_in_colab/tests/data/extras/
        echo "This is an extra file" > open_in_colab/tests/data/extras/extra.dat
        date > open_in_colab/tests/data/extras/$(tr -dc "a-zA-Z0-9" </dev/urandom | head -c 10).dat
      fem_on_colab_packages: |
        mpi4py
      pip_packages: |
        python-dateutil$dateutil
        kaleido%plotly
        itkwidgets
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests
      publish_on: artifact@open-in-colab-notebooks-from-git
      publish_if_repository: fem-on-colab/open-in-colab-workflow

  test_workflow_publish_on_artifact_notebooks_from_another_artifact:
    needs: [test_library, upload_notebooks_as_artifact]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      extra_files_pattern: "**/*.dat"
      notebook_preparation: |
        curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          > artifacts.json
        export ARTIFACT_NAME=all-notebooks
        ARTIFACT_URL=$(jq -r ".artifacts[] | select(.name==\"$ARTIFACT_NAME\") | .archive_download_url" artifacts.json)
        if [ -z "$ARTIFACT_URL" ]; then
          echo "Artifact not found"
          cat artifacts.json
          exit 1
        fi
        curl -L -s -H "Authorization: token $GITHUB_TOKEN" -o $ARTIFACT_NAME.zip "$ARTIFACT_URL"
        unzip -oq $ARTIFACT_NAME.zip -d open_in_colab
        rm -f $ARTIFACT_NAME.zip
      extra_files_preparation: |
        rsync -avz --include "*/" --include="*.png" --include="*.jpg" --include="*.svg" --exclude="*" source/tests open_in_colab/
        mkdir -p open_in_colab/tests/data/extras/
        echo "This is an extra file" > open_in_colab/tests/data/extras/extra.dat
        date > open_in_colab/tests/data/extras/$(tr -dc "a-zA-Z0-9" </dev/urandom | head -c 10).dat
      fem_on_colab_packages: |
        mpi4py
      pip_packages: |
        python-dateutil$dateutil
        kaleido%plotly
        itkwidgets
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests
      publish_on: artifact@open-in-colab-notebooks-from-another-artifact
      publish_if_repository: fem-on-colab/open-in-colab-workflow

  test_workflow_publish_on_drive:
    needs: [test_library]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      extra_files_pattern: "**/*.dat"
      notebook_preparation: |
        rsync -avz --include "*/" --include="*.ipynb" --exclude="*" source/tests open_in_colab/
      extra_files_preparation: |
        rsync -avz --include "*/" --include="*.png" --include="*.jpg" --include="*.svg" --exclude="*" source/tests open_in_colab/
        mkdir -p open_in_colab/tests/data/extras/
        echo "This is an extra file" > open_in_colab/tests/data/extras/extra.dat
        date > open_in_colab/tests/data/extras/$(tr -dc "a-zA-Z0-9" </dev/urandom | head -c 10).dat
      fem_on_colab_packages: |
        mpi4py
      pip_packages: |
        python-dateutil$dateutil
        kaleido%plotly
        itkwidgets
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests
      publish_on: drive@GitHub/open_in_colab_workflow
      publish_if_repository: fem-on-colab/open-in-colab-workflow
    secrets:
      RCLONE_CONFIG_DRIVE_CLIENT_ID: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}"
      RCLONE_CONFIG_DRIVE_CLIENT_SECRET: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}"
      RCLONE_CONFIG_DRIVE_TOKEN: "${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}"

  test_workflow_source_from_drive:
    needs: [test_workflow_publish_on_drive]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      source_from: drive@GitHub/open_in_colab_workflow
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      notebook_preparation: |
        rsync -avz --include "*/" --include="*.ipynb" --exclude="*" source/tests open_in_colab/
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests
    secrets:
      RCLONE_CONFIG_DRIVE_CLIENT_ID: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}"
      RCLONE_CONFIG_DRIVE_CLIENT_SECRET: "${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}"
      RCLONE_CONFIG_DRIVE_TOKEN: "${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}"

  test_workflow_publish_on_github:
    needs: [test_library]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      extra_files_pattern: "**/*.dat"
      notebook_preparation: |
        rsync -avz --delete --include "*/" --include="*.ipynb" --exclude="*" source/tests open_in_colab/
      extra_files_preparation: |
        rsync -avz --delete --include "*/" --include="*.png" --include="*.jpg" --include="*.svg" --exclude="*" source/tests open_in_colab/
        mkdir -p open_in_colab/tests/data/extras/
        echo "This is an extra file" > open_in_colab/tests/data/extras/extra.dat
        date > open_in_colab/tests/data/extras/$(tr -dc "a-zA-Z0-9" </dev/urandom | head -c 10).dat
      fem_on_colab_packages: |
        mpi4py
      pip_packages: |
        python-dateutil$dateutil
        kaleido%plotly
        itkwidgets
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests
      publish_on: github@fem-on-colab/open-in-colab-workflow@open-in-colab
      publish_if_repository: fem-on-colab/open-in-colab-workflow

  test_workflow_source_from_github:
    needs: [test_workflow_publish_on_github]
    uses: ./.github/workflows/workflow_call.yml
    with:
      source_directory: source
      source_from: github@fem-on-colab/open-in-colab-workflow@open-in-colab
      work_directory: open_in_colab
      notebook_pattern: "**/*.ipynb"
      notebook_preparation: |
        rsync -avz --delete --include "*/" --include="*.ipynb" --exclude="*" source/tests open_in_colab/
      test_script: |
        python3 -m pytest --nbval open_in_colab/tests

  warn:
    runs-on: ubuntu-latest
    if: github.repository == 'fem-on-colab/open-in-colab-workflow' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    steps:
      - name: Warn if scheduled workflow is about to be disabled
        uses: fem-on-colab/warn-workflow-about-to-be-disabled-action@58c6022d9aeb22accfa8df9bf5b58c3d8867208c  # v1.0.0
        with:
          workflow-filename: ci.yml
          days-elapsed: 50
